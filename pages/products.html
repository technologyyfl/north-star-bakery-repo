<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery</title>
    <link rel="stylesheet" href="./css/styles.css"
</head>
<body>
        <header>
        <!-- 1. Brand Logo & Title / Nav -->
        <a href="./index.html" class="logo">
            <img src="../images/bakery-logo_c.png" alt="North Star Bakery Logo" width="250" height="250">
        </a>
        <h1>Products</h1>
        <nav>
            <a href="./index.html">Home</a>
            <a href="./products.html">Products</a>
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <p class="product-message">Baked fresh every morning! Daily!</p>
        <section id="breads">
            <figure>
                <img src="../images/bakery-signature-loaf_c.png" alt="signature loaf" width="250">
                <figcaption>Figure 1. North Star Bakery's signature loaf.</figcaption>
            </figure>
        </section>
        <section id="pastries">
            Pastries - Sold out!
        </section>
        <section id="cakes">
            Cakes - Sold out!
        </section>
        <section id="price-range">
            <label for="bread-price" id="price-range-label">Price Range</label>
            <input type="number" id="bread-price" name="bread-price" min="1" max="10" step="1">
        </section>
    </main>
    <footer>&copy; 2026 North Star Bakery</footer>
</body>
</html>
